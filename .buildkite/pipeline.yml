env:
  # SECRET_CODECOV_TOKEN can be added here if needed for coverage reporting

steps:
  - label: "Julia v{{matrix.version}}, {{matrix.label}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      # - JuliaCI/julia-coverage#v1:
      #     dirs:
      #       - src
      #       - ext
    command: julia --eval='println(pwd()); println(readdir()); include("test/ext/CUDA/cuda.jl")'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
    env:
      LABEL: "{{matrix.label}}"
      TEST_TYPE: ext
    matrix:
      setup:
        version:
          - "1"
          - "1.10"
        label:
          - "cuda"

  # The demo has its own project, and develops the checkout because its compat asks for a
  # version that is not registered yet.
  - label: "GPU demo, Julia v1"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
    command: julia --project=example/gpu --eval='using Pkg; Pkg.develop(; path=pwd()); Pkg.instantiate(); include("example/gpu/demo_gpu.jl")'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 30
